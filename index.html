<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tulips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Crimson+Pro:ital,wght@0,200;0,300;1,200;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #03040a;
        overflow: hidden;
        cursor: crosshair;
      }
      body {
        background: radial-gradient(
          ellipse 80% 60% at 50% 55%,
          #0a0c1e 0%,
          #04050e 55%,
          #010208 100%
        );
        overflow-x: hidden;
        font-family: "Crimson Pro", serif;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse 85% 80% at 50% 50%,
          transparent 35%,
          rgba(0, 0, 0, 0.85) 100%
        );
        pointer-events: none;
        z-index: 10;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 11;
        opacity: 0.6;
      }

      .amb {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        pointer-events: none;
        z-index: 0;
        animation: ambPulse var(--t, 8s) ease-in-out infinite alternate;
        transition: background 1.2s ease;
      }
      .amb1 {
        width: 500px;
        height: 380px;
        left: 28%;
        top: 28%;
        background: rgba(56, 162, 165, 0.09);
        --t: 9s;
      }
      .amb2 {
        width: 360px;
        height: 340px;
        left: 54%;
        top: 38%;
        background: rgba(150, 0, 233, 0.07);
        --t: 12s;
      }
      .amb3 {
        width: 300px;
        height: 240px;
        left: 18%;
        top: 48%;
        background: rgba(20, 60, 255, 0.06);
        --t: 7s;
      }
      .amb4 {
        width: 280px;
        height: 200px;
        left: 60%;
        top: 62%;
        background: rgba(255, 60, 0, 0.05);
        --t: 10s;
      }
      @keyframes ambPulse {
        from {
          opacity: 0.4;
          transform: scale(1);
        }
        to {
          opacity: 1;
          transform: scale(1.18);
        }
      }

      #particles {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #shimmer {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      #svg-wrap {
        position: fixed;
        z-index: 5;
        width: 100%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: wakeUp 2.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        transform-origin: center center;
        will-change: transform;
        transition: filter 0.6s ease;
      }
      @keyframes wakeUp {
        from {
          opacity: 0;
          transform: translate(-50%, -52%) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      #svg-wrap svg {
        width: 100%;
        height: auto;
      }
      #svg-wrap.bloom-burst {
        filter: brightness(1.8) saturate(1.5);
      }

      .svgp {
        opacity: 0;
        animation:
          growBloom var(--ed, 1.2s) cubic-bezier(0.25, 1.2, 0.5, 1)
            var(--ed2, 0s) forwards,
          var(--ia, float1) var(--id, 7s) ease-in-out var(--id2, 0s) infinite;
      }
      @keyframes growBloom {
        0% {
          opacity: 0;
          transform: scale(0.05) rotate(-4deg);
          filter: brightness(3) blur(3px);
        }
        50% {
          opacity: 1;
          transform: scale(1.1) rotate(0.8deg);
          filter: brightness(1.2);
        }
        72% {
          transform: scale(0.96) rotate(-0.3deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
          filter: brightness(1);
        }
      }
      @keyframes float1 {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        30% {
          transform: translate(2px, -6px) rotate(0.4deg);
        }
        65% {
          transform: translate(-2px, 4px) rotate(-0.35deg);
        }
      }
      @keyframes float2 {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        40% {
          transform: translate(-4px, -5px) rotate(-0.55deg);
        }
        75% {
          transform: translate(3px, 5px) rotate(0.45deg);
        }
      }
      @keyframes float3 {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(4px, 4px) rotate(0.35deg);
        }
        70% {
          transform: translate(-3px, -5px) rotate(-0.5deg);
        }
      }
      @keyframes float4 {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        35% {
          transform: translate(-4px, 5px) rotate(-0.45deg);
        }
        70% {
          transform: translate(4px, -4px) rotate(0.55deg);
        }
      }
      @keyframes float5 {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        45% {
          transform: translate(5px, -4px) rotate(0.6deg);
        }
        80% {
          transform: translate(-4px, 4px) rotate(-0.4deg);
        }
      }
      @keyframes float6 {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        30% {
          transform: translate(-5px, -3px) rotate(-0.55deg);
        }
        65% {
          transform: translate(3px, 6px) rotate(1.5deg);
        }
      }
      @keyframes float7 {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(0, -8px) rotate(1deg);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scaleY(1) translate(0, 0);
          opacity: 1;
        }
        50% {
          transform: scaleY(1.025) translate(0, -12px);
          opacity: 0.75;
        }
      }

      @keyframes glowTeal {
        0%,
        100% {
          filter: drop-shadow(0 0 5px rgba(56, 162, 165, 0.7))
            drop-shadow(0 0 16px rgba(56, 162, 165, 0.25));
        }
        50% {
          filter: drop-shadow(0 0 14px rgba(56, 162, 165, 1))
            drop-shadow(0 0 40px rgba(56, 162, 165, 0.55))
            drop-shadow(0 0 80px rgba(56, 162, 165, 0.15));
        }
      }
      @keyframes glowFire {
        0%,
        100% {
          filter: drop-shadow(0 0 5px rgba(255, 100, 0, 0.7))
            drop-shadow(0 0 16px rgba(255, 40, 0, 0.25));
        }
        50% {
          filter: drop-shadow(0 0 16px rgba(255, 140, 0, 1))
            drop-shadow(0 0 45px rgba(255, 60, 0, 0.6))
            drop-shadow(0 0 90px rgba(255, 30, 0, 0.2));
        }
      }
      @keyframes glowPink {
        0%,
        100% {
          filter: drop-shadow(0 0 5px rgba(240, 0, 240, 0.7))
            drop-shadow(0 0 16px rgba(200, 0, 255, 0.25));
        }
        50% {
          filter: drop-shadow(0 0 16px rgba(255, 0, 255, 1))
            drop-shadow(0 0 45px rgba(200, 0, 255, 0.6))
            drop-shadow(0 0 90px rgba(180, 0, 255, 0.2));
        }
      }
      @keyframes glowBlue {
        0%,
        100% {
          filter: drop-shadow(0 0 5px rgba(80, 60, 255, 0.7))
            drop-shadow(0 0 16px rgba(148, 0, 233, 0.25));
        }
        50% {
          filter: drop-shadow(0 0 16px rgba(100, 80, 255, 1))
            drop-shadow(0 0 45px rgba(148, 0, 233, 0.6))
            drop-shadow(0 0 90px rgba(100, 0, 255, 0.2));
        }
      }

      .pulse-teal {
        animation:
          growBloom var(--ed, 1.2s) cubic-bezier(0.25, 1.2, 0.5, 1)
            var(--ed2, 0s) forwards,
          var(--ia, float1) var(--id, 7s) ease-in-out var(--id2, 0s) infinite,
          glowTeal 3.2s ease-in-out var(--id2, 0s) infinite;
      }
      .pulse-fire {
        animation:
          growBloom var(--ed, 1.2s) cubic-bezier(0.25, 1.2, 0.5, 1)
            var(--ed2, 0s) forwards,
          var(--ia, float1) var(--id, 7s) ease-in-out var(--id2, 0s) infinite,
          glowFire 2.8s ease-in-out var(--id2, 0s) infinite;
      }
      .pulse-pink {
        animation:
          growBloom var(--ed, 1.2s) cubic-bezier(0.25, 1.2, 0.5, 1)
            var(--ed2, 0s) forwards,
          var(--ia, float1) var(--id, 7s) ease-in-out var(--id2, 0s) infinite,
          glowPink 3.6s ease-in-out var(--id2, 0s) infinite;
      }
      .pulse-blue {
        animation:
          growBloom var(--ed, 1.2s) cubic-bezier(0.25, 1.2, 0.5, 1)
            var(--ed2, 0s) forwards,
          var(--ia, float1) var(--id, 7s) ease-in-out var(--id2, 0s) infinite,
          glowBlue 4.1s ease-in-out var(--id2, 0s) infinite;
      }

      .msg-card {
        position: fixed;
        z-index: 30;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: msgRise var(--rise, 5s) cubic-bezier(0.2, 0.8, 0.4, 1)
          forwards;
      }
      @keyframes msgRise {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.5) translateY(0px);
        }
        12% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.05) translateY(-10px);
        }
        88% {
          opacity: 0.9;
          transform: translate(-50%, -120%) scale(1) translateY(-200px);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -120%) scale(0.9) translateY(-260px);
        }
      }
      .msg-card-inner {
        background: rgba(255, 255, 255, 0.04);
        border: 0.5px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        padding: 14px 22px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 0 30px var(--card-shadow, rgba(56, 162, 165, 0.25)),
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.06);
        white-space: nowrap;
      }
      .msg-card-inner p {
        font-family: "Cormorant Garamond", serif;
        font-weight: 300;
        font-style: italic;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: 0.03em;
      }
    

      #input-bar {
        position: fixed;
        bottom: 7vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        gap: 10px;
        align-items: center;
        opacity: 0;
        animation: fadeIn 1.5s ease 3s forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      #msg-input {
        background: rgba(255, 255, 255, 0.05);
        border: 0.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 50px;
        padding: 10px 22px;
        color: rgba(255, 255, 255, 0.8);
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 15px;
        letter-spacing: 0.04em;
        outline: none;
        width: 280px;
        backdrop-filter: blur(10px);
        transition:
          border-color 0.3s,
          box-shadow 0.3s,
          width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      }
      #msg-input::placeholder {
        color: rgba(255, 255, 255, 0.2);
        font-style: italic;
      }
      #msg-input:focus {
        border-color: rgba(56, 162, 165, 0.5);
        box-shadow: 0 0 20px rgba(56, 162, 165, 0.2);
        width: 340px;
      }
      #send-btn {
        background: rgba(56, 162, 165, 0.15);
        border: 0.5px solid rgba(56, 162, 165, 0.4);
        border-radius: 50px;
        padding: 10px 20px;
        color: rgba(56, 162, 165, 0.9);
        font-family: "Crimson Pro", serif;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.25s;
        backdrop-filter: blur(10px);
      }
      #send-btn:hover {
        background: rgba(56, 162, 165, 0.3);
        box-shadow: 0 0 20px rgba(56, 162, 165, 0.3);
        transform: scale(1.04);
      }
      #send-btn:active {
        transform: scale(0.97);
      }

      #hint {
        position: fixed;
        top: 6vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        text-align: center;
        opacity: 0;
        animation: fadeIn 2s ease 3.5s forwards;
        pointer-events: none;
      }
      #hint p {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 300;
        font-size: clamp(11px, 1.2vw, 13px);
        letter-spacing: 0.25em;
        color: rgba(255, 255, 255, 0.18);
      }

      .ripple {
        position: fixed;
        z-index: 15;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0);
        border: 1px solid rgba(255, 255, 255, 0.3);
        animation: rippleOut 1.2s cubic-bezier(0.15, 0.8, 0.3, 1) forwards;
      }
      @keyframes rippleOut {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0.8;
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }
      }

      #cursor-glow {
        position: fixed;
        z-index: 8;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(56, 162, 165, 0.12) 0%,
          transparent 70%
        );
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition:
          left 0.08s,
          top 0.08s;
        mix-blend-mode: screen;
      }

      #aurora {
        position: fixed;
        z-index: 3;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        opacity: 0.32;
        animation: auroraDrift 18s ease-in-out infinite alternate;
      }
      @keyframes auroraDrift {
        0% {
          filter: hue-rotate(0deg) saturate(1.2);
        }
        100% {
          filter: hue-rotate(30deg) saturate(1.6);
        }
      }

      #title {
        position: fixed;
        bottom: 12.5vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 25;
        text-align: center;
        opacity: 0;
        animation: fadeIn 2s ease 2.8s forwards;
        pointer-events: none;
      }
      #title h1 {
        font-family: "Cormorant Garamond", serif;
        font-weight: 300;
        font-size: clamp(11px, 1.3vw, 14px);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.18);
      }
      #title h1 span {
        color: rgba(56, 162, 165, 0.55);
      }
    </style>
  </head>

    <canvas id="particles"></canvas>

          shadow: "rgba(255,120,0,0.28)",
          border: "rgba(255,120,0,0.15)",
        },
        {
          text: "You are the best thing that ever happened to me 🤗",
          shadow: "rgba(56,162,165,0.3)",
          border: "rgba(56,162,165,0.15)",
        },
        {
          text: "You are my Waifu ❤️",
          shadow: "rgba(200,0,255,0.28)",
          border: "rgba(200,0,255,0.15)",
        },
        {
          text: "You are home to me 🏠",
          shadow: "rgba(80,160,255,0.3)",
          border: "rgba(80,160,255,0.18)",
        },
        {
          text: "You are my sunshine ☀️",
          shadow: "rgba(255,80,160,0.28)",
          border: "rgba(255,80,160,0.15)",
        },
        {
          text: "You are my everything 💕",
          shadow: "rgba(56,162,165,0.32)",
          border: "rgba(56,162,165,0.18)",
        },
        {
          text: "My favorite person 💖",
          shadow: "rgba(200,120,255,0.28)",
          border: "rgba(200,120,255,0.15)",
        },
        {
          text: "I adore you 🥰",
          shadow: "rgba(200,120,255,0.28)",
          border: "rgba(200,120,255,0.15)",
        },
      ];

      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      function resizeC() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeC();
      window.addEventListener("resize", resizeC);

      const COLORS = [
        "rgba(56,162,165,",
        "rgba(255,100,30,",
        "rgba(220,0,255,",
        "rgba(80,60,255,",
        "rgba(255,200,50,",
        "rgba(200,220,255,",
      ];

      class Particle {
        constructor(x, y, burst) {
          this.burst = burst || false;
          if (burst) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = -(1 + Math.random() * 5);
            this.r = 1 + Math.random() * 3;
            this.life = 0;
            this.maxLife = 60 + Math.random() * 80;
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            this.alpha = 0.9;
            this.gravity = 0.08;
          } else {
            this.reset(true);
          }
        }
        reset(init) {
          this.x = Math.random() * canvas.width;
          this.y = init ? Math.random() * canvas.height : canvas.height + 10;
          this.r = 0.6 + Math.random() * 2.8;
          this.speed = 0.18 + Math.random() * 0.9;
          this.drift = (Math.random() - 0.5) * 0.28;
          this.alpha = 0;
          this.maxAlpha = 0.15 + Math.random() * 0.6;
          this.life = 0;
          this.maxLife = 160 + Math.random() * 280;
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          this.tw = Math.random() * Math.PI * 2;
          this.tws = 0.02 + Math.random() * 0.04;
        }
        update() {
          if (this.burst) {
            this.life++;
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.vx *= 0.98;
            this.alpha = Math.max(0, 0.9 * (1 - this.life / this.maxLife));
            return this.life < this.maxLife;
          }
          this.life++;
          this.y -= this.speed;
          this.x += this.drift;
          this.tw += this.tws;
          const half = this.maxLife * 0.3;
          if (this.life < half) this.alpha = (this.life / half) * this.maxAlpha;
          else
            this.alpha =
              (1 - (this.life - half) / (this.maxLife - half)) * this.maxAlpha;
          this.displayAlpha = this.alpha * (0.7 + 0.3 * Math.sin(this.tw));
          if (this.life >= this.maxLife || this.y < -12) {
            this.reset(false);
          }
          return true;
        }
        draw() {
          ctx.save();
          ctx.globalAlpha = Math.max(
            0,
            this.burst ? this.alpha : this.displayAlpha || this.alpha,
          );
          const rr = this.burst ? this.r * 2 : this.r * 3;
          const gr = ctx.createRadialGradient(
            this.x,
            this.y,
            0,
            this.x,
            this.y,
            rr,
          );
          gr.addColorStop(0, this.color + "1)");
          gr.addColorStop(0.4, this.color + "0.6)");
          gr.addColorStop(1, this.color + "0)");
          ctx.fillStyle = gr;
          ctx.beginPath();
          ctx.arc(this.x, this.y, rr, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      let baseParticles = Array.from({ length: 180 }, () => new Particle());
      let burstParticles = [];

      const sc = document.getElementById("shimmer");
      const sctx = sc.getContext("2d");
      function resizeS() {
        sc.width = window.innerWidth;
        sc.height = window.innerHeight;
      }
      resizeS();
      window.addEventListener("resize", resizeS);

      class ShimmerLine {
        constructor() {
          this.reset();
        }
        reset() {
          this.x =
            window.innerWidth * 0.3 + Math.random() * window.innerWidth * 0.4;
          this.y = window.innerHeight + Math.random() * 100;
          this.len = 40 + Math.random() * 120;
          this.speed = 0.4 + Math.random() * 1.2;
          this.alpha = 0;
          this.maxAlpha = 0.03 + Math.random() * 0.08;
          this.life = 0;
          this.maxLife = 80 + Math.random() * 160;
          this.hue =
            Math.random() < 0.5 ? "rgba(56,162,165," : "rgba(148,60,255,";
        }
        update() {
          this.life++;
          this.y -= this.speed;
          const half = this.maxLife * 0.25;
          if (this.life < half) this.alpha = (this.life / half) * this.maxAlpha;
          else
            this.alpha =
              (1 - (this.life - half) / (this.maxLife - half)) * this.maxAlpha;
          if (this.life >= this.maxLife || this.y < -this.len) this.reset();
        }
        draw() {
          sctx.save();
          const gr = sctx.createLinearGradient(
            this.x,
            this.y + this.len,
            this.x,
            this.y,
          );
          gr.addColorStop(0, this.hue + "0)");
          gr.addColorStop(0.5, this.hue + this.alpha + ")");
          gr.addColorStop(1, this.hue + "0)");
          sctx.strokeStyle = gr;
          sctx.lineWidth = 0.5 + Math.random() * 0.5;
          sctx.beginPath();
          sctx.moveTo(this.x, this.y + this.len);
          sctx.lineTo(this.x, this.y);
          sctx.stroke();
          sctx.restore();
        }
      }
      const shimmerLines = Array.from({ length: 30 }, () => new ShimmerLine());

      const svgWrap = document.getElementById("svg-wrap");
      const cursorGlow = document.getElementById("cursor-glow");
      let mx = window.innerWidth / 2,
        my = window.innerHeight / 2;
      let lx = mx,
        ly = my;

      document.addEventListener("mousemove", (e) => {
        mx = e.clientX;
        my = e.clientY;
        cursorGlow.style.left = mx + "px";
        cursorGlow.style.top = my + "px";
      });

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function updateParallax() {
        lx = lerp(lx, mx, 0.045);
        ly = lerp(ly, my, 0.045);
        const cx = window.innerWidth / 2,
          cy = window.innerHeight / 2;
        const dx = (lx - cx) / cx;
        const dy = (ly - cy) / cy;
        const tiltX = dy * 6;
        const tiltY = -dx * 5;
        const tx = dx * 10;
        const ty = dy * 8;
        svgWrap.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) perspective(800px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
      }

      function spawnRipple(x, y, color) {
        const sz = 80 + Math.random() * 80;
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-color:${color || "rgba(56,162,165,0.5)"};`;
        document.body.appendChild(r);
        const r2 = document.createElement("div");
        r2.className = "ripple";
        r2.style.cssText = `left:${x}px;top:${y}px;width:${sz * 1.6}px;height:${sz * 1.6}px;border-color:${color || "rgba(56,162,165,0.25)"};animation-delay:0.15s;`;
        document.body.appendChild(r2);
        setTimeout(() => {
          r.remove();
          r2.remove();
        }, 1400);
      }

      function spawnBurst(x, y, n) {
        for (let i = 0; i < (n || 40); i++)
          burstParticles.push(new Particle(x, y, true));
      }

      
      function spawnMessage(x, y, data) {
        const m =
          data ||
          DEFAULT_MESSAGES[Math.floor(Math.random() * DEFAULT_MESSAGES.length)];
        const card = document.createElement("div");
        card.className = "msg-card";
        card.style.cssText = `left:${x}px;top:${y}px;--rise:${4.5 + Math.random() * 2}s;`;
        card.innerHTML = `<div class="msg-card-inner" style="border-color:${m.border || "rgba(56,162,165,0.2)"};--card-shadow:${m.shadow || "rgba(56,162,165,0.25)"}">
   
    <p>${m.text}</p>
  </div>`;
        document.body.appendChild(card);
        const dur = parseFloat(card.style.getPropertyValue("--rise")) || 5;
        setTimeout(() => card.remove(), (dur + 0.5) * 1000);
      }

      let bloomTimeout = null;
      function bloomBurst() {
        svgWrap.classList.add("bloom-burst");
        clearTimeout(bloomTimeout);
        bloomTimeout = setTimeout(
          () => svgWrap.classList.remove("bloom-burst"),
          600,
        );
      }

      document.addEventListener("click", (e) => {
        if (e.target.closest("#input-bar")) return;
        const x = e.clientX,
          y = e.clientY;
        const msg =
          DEFAULT_MESSAGES[Math.floor(Math.random() * DEFAULT_MESSAGES.length)];
        spawnRipple(x, y, msg.shadow);
        spawnBurst(x, y, 50);
        spawnMessage(x, y, msg);
        bloomBurst();
      });

     
    

      const GLOW_COLORS = [
        "rgba(56,162,165,0.14)",
        "rgba(200,0,255,0.12)",
        "rgba(80,80,255,0.12)",
        "rgba(255,100,0,0.10)",
      ];
      let glowIdx = 0,
        glowTarget = 0,
        glowT = 0;
      setInterval(() => {
        glowTarget = Math.floor(Math.random() * GLOW_COLORS.length);
      }, 4000);

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        sctx.clearRect(0, 0, sc.width, sc.height);
        for (const p of baseParticles) {
          p.update();
          p.draw();
        }
        burstParticles = burstParticles.filter((p) => {
          p.draw();
          return p.update();
        });
        for (const s of shimmerLines) {
          s.update();
          s.draw();
        }
        updateParallax();
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
